<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta charset="UTF-8">
  <title th:text="${title} ?: 'TaskBoard'">Board</title>
  <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>

<!-- Меню пользователя -->
<div class="user-menu" style="position: absolute; top: 10px; right: 10px;">
  <div sec:authorize="isAuthenticated()">
    Привет, <span sec:authentication="name"></span>!
    <a th:href="@{/profile}" style="margin-left: 10px;">Профиль</a>
    <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 10px;">
      <button type="submit" style="background: none; border: none; color: blue; cursor: pointer; text-decoration: underline;">Выйти</button>
    </form>
  </div>
</div>


<!-- Передаём значения контроллера в data-атрибуты -->
<div id="boardData"
     th:attr="data-board-id=${boardId}, data-year=${year}, data-month=${month}, data-title=${title}"
     style="display:none"></div>

<!-- Заголовок теперь управляется JS: "${title} на <месяц>" -->
<h2 id="pageTitle" th:text="${title}">Board</h2>

<div class="controls" style="text-align:center;">
  <button id="prevMonth">Пред</button>
  <button id="nextMonth">След</button>
  <span class="small" id="currentMonthLabel"></span>
  <button id="openCreateBoard">Создать новую доску</button>
</div>

<div class="container">
  <div>
    <div class="weekday-row" id="weekdayRow">
      <div class="weekday">Пн</div>
      <div class="weekday">Вт</div>
      <div class="weekday">Ср</div>
      <div class="weekday">Чт</div>
      <div class="weekday">Пт</div>
      <div class="weekday">Сб</div>
      <div class="weekday">Вс</div>
    </div>

    <div class="month-grid" id="monthGrid"></div>
  </div>

  <div class="week-column">
    <h3>Текущая неделя</h3>
    <div id="weekContainer"></div>
  </div>
</div>

<!-- ======= Модальное окно создания доски ======= -->
<div class="modal" id="createBoardModal">
  <div class="modal-content">
    <h3>Создать новую доску</h3>

    <div class="form-row">
      <label>Заголовок</label>
      <input id="cb-title" type="text" placeholder="Название (необязательно)">
    </div>

    <div class="form-row">
      <label>Год</label>
      <input id="cb-year" type="number" min="1900" max="3000">
      <label>Месяц</label>
      <input id="cb-month" type="number" min="1" max="12">
    </div>

    <div class="form-row">
      <label>Домохозяйство</label>
      <select id="cb-household-select">
        <option value="">Загрузка...</option>
      </select>
      <div id="cb-new-household-row" style="display:none; width:100%;">
        <input id="cb-new-household-name" type="text" placeholder="Название нового домохозяйства">
      </div>
    </div>

    <div class="form-actions">
      <button id="cb-create-btn" type="button">Создать</button>
      <button id="cb-cancel-btn" type="button">Отмена</button>
    </div>

    <div id="cb-error" style="display:none"></div>
  </div>
</div>

<script th:src="@{/js/board.js}"></script>
</body>
</html>
