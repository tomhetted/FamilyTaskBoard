<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title} ?: 'TaskBoard'">Board</title>
  <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>

<!-- Передаём значения контроллера в data-атрибуты -->
<div id="boardData"
     th:attr="data-board-id=${boardId}, data-year=${year}, data-month=${month}, data-title=${title}"
     style="display:none"></div>

<h1 id="pageTitle" th:text="${title} + ' ' + ${year} + '-' + ${month}">Board</h1>

<div class="controls">
  <button id="prevMonth">Prev</button>
  <button id="nextMonth">Next</button>
  <span class="small" id="currentMonthLabel"></span>
</div>

<div class="container">
  <div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <div class="week-column">
    <h3>Текущая неделя</h3>
    <div id="weekContainer"></div>
  </div>
</div>

<script th:src="@{/js/board.js}"></script>
</body>
</html>
