<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Регистрация в TaskBoard</title>
  <style>
    .auth-container {
        max-width: 500px;
        margin: 30px auto;
        padding: 25px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
    }
    .form-group {
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
    }
    .form-hint {
        font-size: 12px;
        color: #666;
        margin-top: 3px;
    }
    .btn {
        width: 100%;
        padding: 12px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
    }
    .btn:hover {
        background-color: #218838;
    }
    .error {
        color: #dc3545;
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #dc3545;
        border-radius: 4px;
        background-color: #f8d7da;
    }
    .auth-links {
        margin-top: 15px;
        text-align: center;
    }
    .auth-links a {
        color: #007bff;
        text-decoration: none;
    }
    .auth-links a:hover {
        text-decoration: underline;
    }
    .form-row {
        display: flex;
        gap: 15px;
    }
    .form-row .form-group {
        flex: 1;
    }
  </style>
</head>
<body>
<div class="auth-container">
  <h2 style="text-align: center; margin-bottom: 25px;">Регистрация в TaskBoard</h2>

  <div th:if="${error}" class="error" th:text="${error}"></div>

  <form th:action="@{/register}" method="post" th:object="${registerRequest}">
    <div class="form-row">
      <div class="form-group">
        <label for="username">Имя пользователя *</label>
        <input type="text" id="username" th:field="*{username}" required>
        <div class="form-hint">От 3 до 50 символов</div>
        <div th:if="${#fields.hasErrors('username')}" class="error" th:errors="*{username}"></div>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" th:field="*{email}" required>
        <div th:if="${#fields.hasErrors('email')}" class="error" th:errors="*{email}"></div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="password">Пароль *</label>
        <input type="password" id="password" th:field="*{password}" required>
        <div class="form-hint">От 6 до 100 символов</div>
        <div th:if="${#fields.hasErrors('password')}" class="error" th:errors="*{password}"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Подтверждение пароля *</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
        <div th:if="${#fields.hasErrors('confirmPassword')}" class="error" th:errors="*{confirmPassword}"></div>
      </div>
    </div>

    <div class="form-group">
      <label for="householdName">Название домохозяйства *</label>
      <input type="text" id="householdName" th:field="*{householdName}" required>
      <div class="form-hint">Например: "Семья Ивановых"</div>
      <div th:if="${#fields.hasErrors('householdName')}" class="error" th:errors="*{householdName}"></div>
    </div>

    <div class="form-group">
      <label for="memberName">Ваше имя как участника *</label>
      <input type="text" id="memberName" th:field="*{memberName}" required>
      <div class="form-hint">Как вас будут видеть другие участники</div>
      <div th:if="${#fields.hasErrors('memberName')}" class="error" th:errors="*{memberName}"></div>
    </div>

    <button type="submit" class="btn">Зарегистрироваться</button>

    <div class="auth-links">
      <p>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
    </div>
  </form>
</div>
</body>
</html>
